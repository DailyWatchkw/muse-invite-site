<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta property="og:url" content="https://muse.soitworks.online/">
<link rel="canonical" href="https://muse.soitworks.online/">
<meta name="description" content="Muse 邀请码互助：分享你的邀请码，或复制一个去兑换。非官方公益站。">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef4ff;color:#16233d;padding-bottom:48px}
  a{color:#2563eb}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e6e9f4}
  .bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .bar h1{font-size:16px;margin:0} .tag{font-size:11px;color:#8a94a6;border:1px solid #dde3f0;border-radius:20px;padding:2px 8px}
  .grow{flex:1}
  main{max-width:920px;margin:0 auto;padding:0 16px}
  h3.sec{font-size:17px;margin:26px 0 4px;display:flex;align-items:center;gap:8px}
  
  .layout{display:grid;gap:6px 22px}
  @media(min-width:860px){ .layout{grid-template-columns:1.25fr .85fr;align-items:start} .col-side{position:sticky;top:66px} }
  .ticker{height:432px;overflow:hidden}
  .track{display:flex;flex-direction:column;transition:transform .6s ease}
  .card{background:#fff;border:1px solid #e6e9f4;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 10px rgba(49,56,120,.05)}
  .card.grey{opacity:.55;background:#f6f7fa}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:23px;font-weight:800;letter-spacing:2px}
  .slots{font-size:13px;color:#66738c;white-space:nowrap}
  .prog{height:6px;background:#eef0f8;border-radius:3px;margin-top:10px;overflow:hidden}
  .prog i{display:block;height:100%;background:#2563eb;border-radius:3px}
  .note{font-size:12px;color:#94a0b5}
  .thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid #e6e9f4}
  button{border:1px solid #d8deee;background:#fff;border-radius:12px;padding:8px 15px;font-size:14px;cursor:pointer;min-height:40px;font-family:inherit}
  button.primary{background:#2563eb;border:none;color:#fff;font-weight:600}
  button:active{transform:scale(.97)} button:disabled{opacity:.5}
  input,textarea{width:100%;border:1px solid #d8deee;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;background:#fff}
  label{font-size:13px;color:#4a5568;display:block;margin:12px 0 6px}
  .hint{font-size:13px;color:#2563eb;min-height:18px;margin-top:6px;font-weight:600}
  .panel{background:#fff;border:1px solid #e6e9f4;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(49,56,120,.05)}
  .manage-box{background:#eefbf0;border:1px solid #bbe7c2;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;word-break:break-all;display:none;line-height:1.7}
  .mini{font-size:12px;color:#a3adc2;background:none;border:none;padding:2px 4px;min-height:0;cursor:pointer}
  .empty{color:#94a0b5;font-size:14px;padding:12px 0}
  footer{color:#94a0b5;font-size:12px;line-height:1.85;margin-top:30px;border-top:1px solid #e6e9f4;padding-top:14px}
  .toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:#1e40af;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">M</span>
  <h1>Muse 邀请码</h1>
  <span class="grow"></span>
  
</div></header>

<main>
  <div class="layout">
    <section class="col-main">
      <h3 class="sec" style="margin-top:18px">领邀请码</h3>
      <div class="ticker" id="ticker"><div class="track" id="track"><div id="pool"></div><div id="pool2"></div></div></div>

      <div id="deadWrap">
        <h3 class="sec">失效</h3>
        <div id="deadpool"></div>
      </div>
    </section>

    <aside class="col-side">
      <h3 class="sec" style="margin-top:18px">提供邀请码</h3>
      <div class="panel" id="sharePanel">
        <label for="shareText">邀请码</label>
        <input id="shareText" placeholder="填写6位邀请码" autocomplete="off">
        <div class="hint" id="detectHint"></div>
        <div style="margin-top:16px"><button class="primary" id="shareBtn" style="width:100%">提交</button></div>
        <div class="manage-box" id="manageBox"></div>
      </div>
    </aside>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let state = { codes: [], collected: [], availableCount: 0, gallery: [], comments: [], stats: {} };
/* 设备标识 + 本机已反馈记录（防刷：一台设备对一条内容只能反馈一次） */
function myDid(){
  let d = localStorage.getItem('muse_did');
  if(!d){ d = Date.now().toString(36) + Math.random().toString(36).slice(2,12); localStorage.setItem('muse_did', d); }
  return d;
}
function reportedSet(){ try{ return JSON.parse(localStorage.getItem('muse_reported')||'{}'); }catch(e){ return {}; } }
function hasReported(kind, id){ const s = reportedSet(); return Array.isArray(s[kind]) && s[kind].includes(id); }
function markReported(kind, id){ const s = reportedSet(); s[kind] = s[kind]||[]; if(!s[kind].includes(id)) s[kind].push(id); localStorage.setItem('muse_reported', JSON.stringify(s)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rel(iso){ const s=(Date.now()-new Date(iso))/1000; if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+' 分钟前'; if(s<86400) return Math.floor(s/3600)+' 小时前'; return Math.floor(s/86400)+' 天前'; }
function badge(c){ return ''; }
function cardHTML(c){
  const pct = c.totalSlots ? Math.round(c.remaining/c.totalSlots*100) : 0;
  const grey = c.status!=='available';
  return `<div class="card ${grey?'grey':''}" data-kind="code" data-id="${c.id}">
    <div class="row">
      <span class="code">${esc(c.code)}</span>${badge(c)}
      <span class="grow"></span>
      <span class="slots">${c.remaining}/${c.totalSlots} 剩余</span>
      <button class="primary" data-act="copy" ${grey?'disabled':''}>复制</button>
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="row" style="margin-top:8px"><span class="note">${c.sourceNote?esc(c.sourceNote)+' · ':''}${rel(c.createdAt)}分享</span></div>
    ${c.image?`<img class="thumb" src="${esc(c.image)}" alt="分享者附图" loading="lazy">`:''}
  </div>`;
}
function render(){
  const poolOk = state.codes.filter(c => c.status==='available');
  const poolDead = state.codes.filter(c => c.status!=='available');
  const poolHtml = poolOk.length ? poolOk.map(cardHTML).join('') : '<div class="empty">暂时没有可用的码。</div>';
  if(poolHtml !== lastPoolHtml){ lastPoolHtml = poolHtml; $('pool').innerHTML = poolHtml; $('pool2').innerHTML = poolHtml; resetTicker(); }
  const dead = poolDead;
  $('deadWrap').style.display = dead.length ? 'block' : 'none';
  $('deadpool').innerHTML = dead.map(cardHTML).join('');
}
async function load(){
  const r = await fetch('/api/codes'); state = await r.json(); render();
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
/* 一张卡一张卡往上滚：每 3 秒上移一张，悬停/按住暂停 */
let lastPoolHtml = null, tIdx = 0, tTimer = null;
function cardOffsets(){ const offs=[0]; let acc=0; for(const k of $('pool').children){ acc += k.offsetHeight + 10; offs.push(acc); } return offs; }
function setY(y){ $('track').style.transform = 'translateY(-' + y + 'px)'; }
function tickerStep(){
  const n = $('pool').children.length; if(n < 2) return;
  const offs = cardOffsets();
  if(tIdx >= n){ const tr = $('track'); tr.style.transition = 'none'; tIdx = 0; setY(0); void tr.offsetWidth; tr.style.transition = ''; return; }
  tIdx++; setY(offs[tIdx]);
}
function resetTicker(){ tIdx = 0; setY(0); if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); }
const tk = $('ticker');
tk.addEventListener('pointerenter', ()=>{ if(tTimer) clearInterval(tTimer); });
tk.addEventListener('pointerleave', ()=>{ if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); });
tk.addEventListener('pointerdown', ()=>{ if(tTimer) clearInterval(tTimer); });
tk.addEventListener('pointerup', ()=> setTimeout(()=>{ if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); }, 4000));
/* 分享码 */
function extract(text){
  const up=(text||'').toUpperCase();
  const m = up.match(/(?:CODE|邀请码)\s*[:：]?\s*([A-Z0-9]{6})\b/) || up.match(/\b[A-Z0-9]{6}\b/);
  return m ? (m[1]||m[0]) : null;
}
$('shareText').addEventListener('input', ()=>{
  const code = extract($('shareText').value);
  $('detectHint').textContent = code ? '识别到：'+code : '';
});
function myTokens(){ try{ return JSON.parse(localStorage.getItem('muse_tokens')||'[]'); }catch(e){ return []; } }
function saveToken(t){ const a = myTokens(); if(!a.includes(t)){ a.push(t); localStorage.setItem('muse_tokens', JSON.stringify(a)); } }
function dropToken(t){ localStorage.setItem('muse_tokens', JSON.stringify(myTokens().filter(x=>x!==t))); }
$('shareBtn').onclick = async ()=>{
  const rawText = $('shareText').value.trim();
  if(!extract(rawText)){ toast('没识别到 6 位邀请码，检查一下填写内容'); return; }
  const r = await fetch('/api/codes', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rawText, totalSlots: 30})});
  const data = await r.json();
  if(!r.ok){ toast(data.error||'提交失败'); return; }
  saveToken(data.manageToken);
  const link = location.origin + data.managePath;
  const box = $('manageBox'); box.style.display='block';
  box.innerHTML = `已加入左边的列表 ✅<br>管理链接（只显示这一次，建议保存）：<br><a href="${link}">${link}</a>`;
  $('shareText').value=''; $('detectHint').textContent='';
  toast('提交成功'); load();
};
fetch('/api/visit', {method:'POST'}).catch(()=>{}).finally(()=>load());
setInterval(()=>{ load(); }, 30000);
</script>
</body>
</html>

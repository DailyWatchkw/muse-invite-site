<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#eef4ff;color:#16233d;padding-bottom:48px}
  a{color:#2563eb}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #e6e9f4}
  .bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
  .logo{width:30px;height:30px;border-radius:9px;background:#2563eb;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
  .bar h1{font-size:16px;margin:0} .tag{font-size:11px;color:#8a94a6;border:1px solid #dde3f0;border-radius:20px;padding:2px 8px}
  .grow{flex:1}
  main{max-width:920px;margin:0 auto;padding:0 16px}
  h3.sec{font-size:17px;margin:26px 0 4px;display:flex;align-items:center;gap:8px}
  
  .layout{display:grid;gap:6px 22px}
  @media(min-width:860px){ .layout{grid-template-columns:1.25fr .85fr;align-items:start} .col-side{position:sticky;top:66px} }
  .ticker{height:432px;overflow:hidden}
  .track{display:flex;flex-direction:column;transition:transform .6s ease}
  .card{background:#fff;border:1px solid #e6e9f4;border-radius:18px;padding:14px 16px;margin:10px 0;box-shadow:0 2px 10px rgba(49,56,120,.05)}
  .card.grey{opacity:.55;background:#f6f7fa}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:23px;font-weight:800;letter-spacing:2px}
  .slots{font-size:13px;color:#66738c;white-space:nowrap}
  .prog{height:6px;background:#eef0f8;border-radius:3px;margin-top:10px;overflow:hidden}
  .prog i{display:block;height:100%;background:#2563eb;border-radius:3px}
  .note{font-size:12px;color:#94a0b5}
  .thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;border:1px solid #e6e9f4}
  button{border:1px solid #d8deee;background:#fff;border-radius:12px;padding:8px 15px;font-size:14px;cursor:pointer;min-height:40px;font-family:inherit}
  button.primary{background:#2563eb;border:none;color:#fff;font-weight:600}
  button:active{transform:scale(.97)} button:disabled{opacity:.5}
  input,textarea{width:100%;border:1px solid #d8deee;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;background:#fff}
  label{font-size:13px;color:#4a5568;display:block;margin:12px 0 6px}
  .hint{font-size:13px;color:#2563eb;min-height:18px;margin-top:6px;font-weight:600}
  .panel{background:#fff;border:1px solid #e6e9f4;border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(49,56,120,.05)}
  .manage-box{background:#eefbf0;border:1px solid #bbe7c2;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;word-break:break-all;display:none;line-height:1.7}
  .mini{font-size:12px;color:#a3adc2;background:none;border:none;padding:2px 4px;min-height:0;cursor:pointer}
  .empty{color:#94a0b5;font-size:14px;padding:12px 0}
  footer{color:#94a0b5;font-size:12px;line-height:1.85;margin-top:30px;border-top:1px solid #e6e9f4;padding-top:14px}
  .toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:#1e40af;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:88vw;text-align:center;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header><div class="bar">
  <span class="logo">M</span>
  <h1 id="siteTitle">Muse 邀请码</h1>
  <span class="grow"></span>
  <button class="mini" id="langBtn" style="font-size:13px;color:#2563eb">EN</button>

</div></header>

<main>
  <div class="layout">
    <section class="col-main">
      <h3 class="sec" style="margin-top:18px" id="secGet">领邀请码</h3>
      <div class="ticker" id="ticker"><div class="track" id="track"><div id="pool"></div><div id="pool2"></div></div></div>

      <div id="deadWrap">
        <h3 class="sec" id="secDead">失效</h3>
        <div id="deadpool"></div>
      </div>
    </section>

    <aside class="col-side">
      <h3 class="sec" style="margin-top:18px" id="secShare">提供邀请码</h3>
      <div class="panel" id="sharePanel">
        <label for="shareText" id="shareLabel">邀请码</label>
        <input id="shareText" placeholder="填写6位邀请码" autocomplete="off">
        <div class="hint" id="detectHint"></div>
        <div style="margin-top:16px"><button class="primary" id="shareBtn" style="width:100%">提交</button></div>
        <div class="manage-box" id="manageBox"></div>
      </div>
    </aside>
  </div>
  <footer id="termsFooter">
    <p><strong>使用条款</strong>：本站为非官方的网友互助站，与 Muse 官方无关。站内邀请码均由网友自愿分享，站方不对其真实性、可用性和剩余名额作任何保证，能否兑换成功以官方规则为准。</p>
    <p>新账号兑换邀请码的时限、奖励规则等以官方公布为准；请勿付费购买邀请码，谨防诈骗。禁止在本站发布违法、广告或与邀请码无关的内容，禁止批量刷码、刷举报等扰乱秩序的行为，站方有权删除违规内容。</p>
    <p>如认为某条内容侵权或不当，请在 X 上联系站方处理：<a href="https://x.com/DailyWatchkw" target="_blank" rel="noopener">@DailyWatchkw</a>。继续使用本站即视为同意以上条款。</p>
  </footer>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
/* 中英双语：按浏览器语言自动切换，右上角可手动切换 */
let LANG = localStorage.getItem('muse_lang') || ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');
const T = {
  zh: { title:'Muse 邀请码', get:'领邀请码', dead:'失效', share:'提供邀请码', codeLabel:'邀请码', ph:'填写6位邀请码', submit:'提交',
    left:'剩余', copy:'复制', bad:"没用", reportedBtn:'已举报', sharedSuffix:'分享', reportedN:n=>' · 被举报 '+n+' 次', empty:'暂时没有可用的码。',
    justNow:'刚刚', minAgo:n=>n+' 分钟前', hrAgo:n=>n+' 小时前', dayAgo:n=>n+' 天前',
    copied:c=>'已复制 '+c+'，名额扣 1', copyFail:c=>'复制失败，码是 '+c+' 请手动输入',
    confirmReport:c=>'确认举报 '+c+' 没用？被举报的码会排到后面，3 台不同设备举报后会标记失效。',
    alreadyReported:'你已经举报过这个码了', reportOk:'已举报，谢谢', detect:'识别到：',
    noCode:'没识别到 6 位邀请码，检查一下填写内容', shareOk:'提交成功', shareFail:'提交失败',
    added:'已加入左边的列表 ✅<br>管理链接（只显示这一次，建议保存）：<br>',
    errDup:'这个码已经在池子里了', errNoCode:'没有识别到 6 位邀请码', langBtn:'EN',
    terms:'<p><strong>使用条款</strong>：本站为非官方的网友互助站，与 Muse 官方无关。站内邀请码均由网友自愿分享，站方不对其真实性、可用性和剩余名额作任何保证，能否兑换成功以官方规则为准。</p><p>新账号兑换邀请码的时限、奖励规则等以官方公布为准；请勿付费购买邀请码，谨防诈骗。禁止在本站发布违法、广告或与邀请码无关的内容，禁止批量刷码、刷举报等扰乱秩序的行为，站方有权删除违规内容。</p><p>如认为某条内容侵权或不当，请在 X 上联系站方处理：<a href="https://x.com/DailyWatchkw" target="_blank" rel="noopener">@DailyWatchkw</a>。继续使用本站即视为同意以上条款。</p>' },
  en: { title:'Muse Invite Codes', get:'Get an invite code', dead:'No longer working', share:'Share your code', codeLabel:'Invite code', ph:'Enter a 6-char code', submit:'Share',
    left:'left', copy:'Copy', bad:"Doesn't work", reportedBtn:'Reported', sharedSuffix:'', reportedN:n=>' · reported '+n+'×', empty:'No codes available right now.',
    justNow:'just now', minAgo:n=>n+'m ago', hrAgo:n=>n+'h ago', dayAgo:n=>n+'d ago',
    copied:c=>'Copied '+c+' — one slot used', copyFail:c=>'Copy failed — type it manually: '+c,
    confirmReport:c=>'Report '+c+' as not working? Reported codes sink to the bottom; 3 reports from different devices mark it dead.',
    alreadyReported:'You already reported this code', reportOk:'Reported — thanks', detect:'Detected: ',
    noCode:'No 6-char code found — check what you typed', shareOk:'Shared — thanks!', shareFail:'Failed to share',
    added:'Added to the list ✅<br>Your manage link (shown only once — save it):<br>',
    errDup:'This code is already listed', errNoCode:'No 6-char code found', langBtn:'中文',
    terms:'<p><strong>Terms</strong>: This is an unofficial community site, not affiliated with Muse. All codes are shared voluntarily by users; we do not guarantee that any code works or has slots left — redemption is subject to Muse\'s official rules.</p><p>Redemption windows and rewards follow Muse\'s official announcements. Never pay for an invite code — beware of scams. No illegal content, ads, spam, bulk code farming or report abuse; violating content may be removed.</p><p>For takedown or other issues, contact us on X: <a href="https://x.com/DailyWatchkw" target="_blank" rel="noopener">@DailyWatchkw</a>. By using this site you agree to these terms.</p>' }
};
const t = k => T[LANG][k];
function applyLang(){
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  $('siteTitle').textContent = t('title');
  $('secGet').textContent = t('get'); $('secDead').textContent = t('dead'); $('secShare').textContent = t('share');
  $('shareLabel').textContent = t('codeLabel'); $('shareText').placeholder = t('ph'); $('shareBtn').textContent = t('submit');
  $('termsFooter').innerHTML = t('terms');
  $('langBtn').textContent = t('langBtn');
}
let state = { codes: [], collected: [], availableCount: 0, gallery: [], comments: [], stats: {} };
/* 设备标识 + 本机已反馈记录（防刷：一台设备对一条内容只能反馈一次） */
function myDid(){
  let d = localStorage.getItem('muse_did');
  if(!d){ d = Date.now().toString(36) + Math.random().toString(36).slice(2,12); localStorage.setItem('muse_did', d); }
  return d;
}
function reportedSet(){ try{ return JSON.parse(localStorage.getItem('muse_reported')||'{}'); }catch(e){ return {}; } }
function hasReported(kind, id){ const s = reportedSet(); return Array.isArray(s[kind]) && s[kind].includes(id); }
function markReported(kind, id){ const s = reportedSet(); s[kind] = s[kind]||[]; if(!s[kind].includes(id)) s[kind].push(id); localStorage.setItem('muse_reported', JSON.stringify(s)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rel(iso){ const s=(Date.now()-new Date(iso))/1000; if(s<60) return t('justNow'); if(s<3600) return t('minAgo')(Math.floor(s/60)); if(s<86400) return t('hrAgo')(Math.floor(s/3600)); return t('dayAgo')(Math.floor(s/86400)); }
function badge(c){ return ''; }
function cardHTML(c){
  const pct = c.totalSlots ? Math.round(c.remaining/c.totalSlots*100) : 0;
  const grey = c.status!=='available';
  return `<div class="card ${grey?'grey':''}" data-kind="code" data-id="${c.id}">
    <div class="row">
      <span class="code">${esc(c.code)}</span>${badge(c)}
      <span class="grow"></span>
      <span class="slots">${c.remaining}/${c.totalSlots} ${t('left')}</span>
      <button class="primary" data-act="copy" ${grey?'disabled':''}>${t('copy')}</button>
      ${grey ? '' : (hasReported('code', c.id) ? '<button disabled>'+t('reportedBtn')+'</button>' : '<button data-act="report">'+t('bad')+'</button>')}
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="row" style="margin-top:8px"><span class="note">${c.sourceNote?esc(c.sourceNote)+' · ':''}${LANG==='zh' ? rel(c.createdAt)+'分享' : 'shared '+rel(c.createdAt)}${c.reports ? t('reportedN')(c.reports) : ''}</span></div>
    ${c.image?`<img class="thumb" src="${esc(c.image)}" alt="" loading="lazy">`:''}
  </div>`;
}
function render(){
  const poolOk = state.codes.filter(c => c.status==='available');
  const poolDead = state.codes.filter(c => c.status!=='available');
  const poolHtml = poolOk.length ? poolOk.map(cardHTML).join('') : '<div class="empty">'+t('empty')+'</div>';
  if(poolHtml !== lastPoolHtml){
    const topEl = $('pool').children[tIdx]; const topId = topEl ? topEl.dataset.id : null;
    lastPoolHtml = poolHtml; $('pool').innerHTML = poolHtml; $('pool2').innerHTML = poolHtml;
    let ni = 0;
    if(topId){ const kids = $('pool').children; for(let i=0;i<kids.length;i++){ if(kids[i].dataset.id===topId){ ni = i; break; } } }
    snapTo(ni); restartTimer();
  }
  const dead = poolDead;
  $('deadWrap').style.display = dead.length ? 'block' : 'none';
  $('deadpool').innerHTML = dead.map(cardHTML).join('');
}
function cacheState(){ try{ localStorage.setItem('muse_state', JSON.stringify(state)); }catch(e){} }
async function load(){
  if(!state.codes.length){
    try{ const cached = JSON.parse(localStorage.getItem('muse_state')||'null'); if(cached && cached.codes){ state = cached; render(); } }catch(e){}
  }
  const r = await fetch('/api/codes'); state = await r.json(); cacheState(); render();
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
/* 卡片按钮：复制 / 举报 */
document.addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]'); if(!btn || btn.disabled) return;
  const wrap = btn.closest('[data-kind="code"]'); if(!wrap) return;
  const id = +wrap.dataset.id;
  const c = [...state.codes, ...state.collected].find(x=>x.id===id); if(!c) return;
  if(btn.dataset.act==='copy'){
    const ok = await copyText(c.code);
    toast(ok ? t('copied')(c.code) : t('copyFail')(c.code));
    const r = await fetch(`/api/codes/${id}/copy`, {method:'POST'}); state = await r.json(); cacheState(); render();
  } else if(btn.dataset.act==='report'){
    if(!confirm(t('confirmReport')(c.code))) return;
    const r = await fetch(`/api/codes/${id}/report`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({did: myDid()})});
    if(r.status===409){ markReported('code', id); cacheState(); render(); toast(t('alreadyReported')); return; }
    state = await r.json(); markReported('code', id); cacheState(); render();
    toast(t('reportOk'));
  }
});
/* 一张卡一张卡往上滚：每 3 秒上移一张，悬停/按住暂停 */
let lastPoolHtml = null, tIdx = 0, tTimer = null;
function cardOffsets(){ const offs=[0]; let acc=0; for(const k of $('pool').children){ acc += k.offsetHeight + 10; offs.push(acc); } return offs; }
function setY(y){ $('track').style.transform = 'translateY(-' + y + 'px)'; }
function snapTo(idx){
  const tr = $('track'); tr.style.transition = 'none';
  tIdx = idx; setY(cardOffsets()[idx] || 0);
  void tr.offsetWidth; tr.style.transition = '';
}
function tickerStep(){
  const n = $('pool').children.length; if(n < 2) return;
  if(tIdx >= n) snapTo(0);
  const offs = cardOffsets();
  tIdx++; setY(offs[tIdx]);
}
function restartTimer(){ if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); }
function resetTicker(){ snapTo(0); restartTimer(); }
const tk = $('ticker');
tk.addEventListener('pointerenter', ()=>{ if(tTimer) clearInterval(tTimer); });
tk.addEventListener('pointerleave', ()=>{ if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); });
tk.addEventListener('pointerdown', ()=>{ if(tTimer) clearInterval(tTimer); });
tk.addEventListener('pointerup', ()=> setTimeout(()=>{ if(tTimer) clearInterval(tTimer); tTimer = setInterval(tickerStep, 3000); }, 4000));
/* 分享码 */
function extract(text){
  const up=(text||'').toUpperCase();
  const m = up.match(/(?:CODE|邀请码)\s*[:：]?\s*([A-Z0-9]{6})\b/) || up.match(/\b[A-Z0-9]{6}\b/);
  return m ? (m[1]||m[0]) : null;
}
$('shareText').addEventListener('input', ()=>{
  const code = extract($('shareText').value);
  $('detectHint').textContent = code ? t('detect')+code : '';
});
function myTokens(){ try{ return JSON.parse(localStorage.getItem('muse_tokens')||'[]'); }catch(e){ return []; } }
function saveToken(t){ const a = myTokens(); if(!a.includes(t)){ a.push(t); localStorage.setItem('muse_tokens', JSON.stringify(a)); } }
function dropToken(t){ localStorage.setItem('muse_tokens', JSON.stringify(myTokens().filter(x=>x!==t))); }
$('shareBtn').onclick = async ()=>{
  const rawText = $('shareText').value.trim();
  if(!extract(rawText)){ toast(t('noCode')); return; }
  const r = await fetch('/api/codes', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rawText, totalSlots: 30})});
  const data = await r.json();
  if(!r.ok){ toast(LANG==='en' ? (data.error===t('errDup')||data.error==='这个码已经在池子里了' ? T.en.errDup : data.error=== '没有识别到 6 位邀请码' ? T.en.errNoCode : data.error||t('shareFail')) : (data.error||t('shareFail'))); return; }
  saveToken(data.manageToken);
  const link = location.origin + data.managePath;
  const box = $('manageBox'); box.style.display='block';
  box.innerHTML = t('added') + `<a href="${link}">${link}</a>`;
  $('shareText').value=''; $('detectHint').textContent='';
  toast(t('shareOk')); load();
};
$('langBtn').onclick = ()=>{ LANG = LANG==='zh' ? 'en' : 'zh'; localStorage.setItem('muse_lang', LANG); location.reload(); };
applyLang();
fetch('/api/visit', {method:'POST'}).catch(()=>{});
load();
setInterval(()=>{ load(); }, 30000);
</script>
</body>
</html>

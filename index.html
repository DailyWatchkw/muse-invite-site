<script>
const $ = id => document.getElementById(id);
let state = { codes: [], collected: [], availableCount: 0, gallery: [], comments: [], stats: {} };
let filter = 'all';
/* 设备标识 + 本机已反馈记录（防刷：一台设备对一条内容只能反馈一次） */
function myDid(){
  let d = localStorage.getItem('muse_did');
  if(!d){ d = Date.now().toString(36) + Math.random().toString(36).slice(2,12); localStorage.setItem('muse_did', d); }
  return d;
}
function reportedSet(){ try{ return JSON.parse(localStorage.getItem('muse_reported')||'{}'); }catch(e){ return {}; } }
function hasReported(kind, id){ const s = reportedSet(); return Array.isArray(s[kind]) && s[kind].includes(id); }
function markReported(kind, id){ const s = reportedSet(); s[kind] = s[kind]||[]; if(!s[kind].includes(id)) s[kind].push(id); localStorage.setItem('muse_reported', JSON.stringify(s)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rel(iso){ const s=(Date.now()-new Date(iso))/1000; if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+' 分钟前'; if(s<86400) return Math.floor(s/3600)+' 小时前'; return Math.floor(s/86400)+' 天前'; }
function badge(c){ return ''; }
function cardHTML(c){
  const pct = c.totalSlots ? Math.round(c.remaining/c.totalSlots*100) : 0;
  const grey = c.status!=='available';
  return `<div class="card ${grey?'grey':''}" data-kind="code" data-id="${c.id}">
    <div class="row">
      <span class="code">${esc(c.code)}</span>${badge(c)}
      <span class="grow"></span>
      <span class="slots">${c.remaining}/${c.totalSlots} 剩余</span>
      <button class="primary" data-act="copy" ${grey?'disabled':''}>复制</button>
      ${hasReported('code', c.id) ? '<button disabled>已反馈</button>' : `<button data-act="report" ${grey?'disabled':''}>用不了</button>`}
    </div>
    <div class="prog"><i style="width:${pct}%"></i></div>
    <div class="row" style="margin-top:8px"><span class="note">${c.sourceNote?esc(c.sourceNote)+' · ':''}${rel(c.createdAt)}分享</span></div>
    ${c.image?`<img class="thumb" src="${esc(c.image)}" alt="分享者附图" loading="lazy">`:''}
  </div>`;
}
function passFilter(c){
  if(filter==='ok') return c.status==='available';
  if(filter==='dead') return c.status!=='available';
  return true;
}
function render(){
  const poolOk = state.codes.filter(c => c.status==='available' && passFilter(c));
  const poolDead = state.codes.filter(c => c.status!=='available');
  const colOk = state.collected.filter(c => c.status==='available' && passFilter(c));
  const colDead = state.collected.filter(c => c.status!=='available');
  $('pool').innerHTML = poolOk.length ? poolOk.map(cardHTML).join('') : '<div class="empty">这个筛选下没有码。</div>';
  $('collected').innerHTML = colOk.length ? colOk.map(cardHTML).join('') : '<div class="empty">这个筛选下没有码。</div>';
  const dead = [...poolDead, ...colDead];
  $('deadWrap').style.display = (dead.length && filter!=='ok') ? 'block' : 'none';
  $('deadpool').innerHTML = dead.map(cardHTML).join('');
  $('gallery').innerHTML = state.gallery.length ? state.gallery.map(g => `
    <div class="gcard" data-kind="gallery" data-id="${g.id}">
      <img src="${esc(g.url)}" alt="用户晒图" loading="lazy">
      <div class="gb">
        <div class="gcap">${esc(g.caption)}</div>
        <div class="row" style="margin-top:6px"><span class="note">${esc(g.name)} · ${rel(g.createdAt)}</span><span class="grow"></span>${hasReported('gallery', g.id) ? '<span class="note">已举报</span>' : '<button class="mini" data-act="greport">举报</button>'}</div>
      </div>
    </div>`).join('') : '<div class="empty">还没有人晒图，来做第一个。</div>';
  const chats = [...state.comments].reverse();
  $('chatList').innerHTML = chats.length ? chats.map(c => `
    <div class="bubble" data-kind="comment" data-id="${c.id}">
      <span class="avatar">${esc((c.name||'匿').slice(0,1))}</span>
      <div class="bb">
        <div class="who">${esc(c.name)} · ${rel(c.createdAt)} ${hasReported('comment', c.id) ? '<span class="note">已举报</span>' : '<button class="mini" data-act="creport">举报</button>'}</div>
        <div class="txt">${esc(c.text)}</div>
      </div>
    </div>`).join('') : '<div class="empty">还没有人说话，来打个招呼。</div>';
  renderMine();
}
async function load(){
  const r = await fetch('/api/codes'); state = await r.json(); render();
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); return ok; }
}
/* 底部导航切换 */
document.querySelectorAll('nav.tabbar button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav.tabbar button').forEach(x => x.classList.toggle('on', x===b));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id==='view-'+b.dataset.view));
    window.scrollTo({top:0});
    if(b.dataset.view==='chat'){ const l=$('chatList'); window.scrollTo({top: document.body.scrollHeight}); }
  };
});
function go(view){ document.querySelector(`nav.tabbar button[data-view="${view}"]`).click(); }
/* 筛选 */
$('filters').addEventListener('click', e => {
  const b = e.target.closest('.fchip'); if(!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.fchip').forEach(x => x.classList.toggle('on', x===b));
  render();
});
document.addEventListener('click', async e=>{
  const btn = e.target.closest('button[data-act]'); if(!btn) return;
  const wrap = btn.closest('[data-kind]'); if(!wrap) return;
  const kind = wrap.dataset.kind, id = +wrap.dataset.id;
  if(kind==='code'){
    const c = [...state.codes, ...state.collected].find(x=>x.id===id); if(!c) return;
    if(btn.dataset.act==='copy'){
      const ok = await copyText(c.code);
      toast(ok ? '已复制 '+c.code+'，名额扣 1' : '复制失败，码是 '+c.code+' 请手动输入');
      const r = await fetch(`/api/codes/${id}/copy`, {method:'POST'}); state = await r.json(); render();
    } else {
      if(!confirm('确认反馈 '+c.code+' 用不了？需要 3 台不同设备都反馈，它才会进「已失效」区。')) return;
      const r = await fetch(`/api/codes/${id}/report`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({did: myDid()})});
      if(r.status===409){ markReported('code', id); render(); toast('你已经反馈过这个码了'); return; }
      state = await r.json(); markReported('code', id); render();
      toast('已记录反馈，谢谢');
    }
  } else if(kind==='gallery' && btn.dataset.act==='greport'){
    if(!confirm('举报这张图？需要 3 台不同设备举报才会隐藏。')) return;
    const r = await fetch(`/api/gallery/${id}/report`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({did: myDid()})});
    if(r.status===409){ markReported('gallery', id); render(); toast('你已经举报过了'); return; }
    state = await r.json(); markReported('gallery', id); render();
    toast('已举报');
  } else if(kind==='comment' && btn.dataset.act==='creport'){
    if(!confirm('举报这条发言？需要 3 台不同设备举报才会隐藏。')) return;
    const r = await fetch(`/api/comments/${id}/report`, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({did: myDid()})});
    if(r.status===409){ markReported('comment', id); render(); toast('你已经举报过了'); return; }
    state = await r.json(); markReported('comment', id); render();
    toast('已举报');
  }
});
/* 图片处理 */
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    if(!file) return resolve(null);
    if(file.size > 8*1024*1024) return reject(new Error('图片原文件太大'));
    const img = new Image();
    img.onload = () => {
      const max = 1280, scale = Math.min(1, max/Math.max(img.width, img.height));
      if(scale===1 && file.size <= 2*1024*1024){ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=reject; fr.readAsDataURL(file); return; }
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      resolve(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function bindFileBox(boxId, inputId, previewId){
  const box = $(boxId), input = $(inputId);
  box.addEventListener('click', e => { if(e.target!==input) input.click(); });
  input.addEventListener('change', async () => {
    const f = input.files[0]; if(!f) return;
    try{ const url = await fileToDataURL(f); $(previewId).innerHTML = `<img src="${url}" alt="预览">`; box.dataset.url = url; }
    catch(err){ toast('这张图读不了，换一张试试'); }
  });
}
bindFileBox('shareFileBox', 'shareFile', 'sharePreview');
bindFileBox('galFileBox', 'galFile', 'galPreview');
/* 昵称（多处同步+记住） */
function setNick(v){ localStorage.setItem('muse_nick', v||''); document.querySelectorAll('.nickInput, #chatNick').forEach(i => { if(i.value!==v) i.value = v||''; }); }
document.querySelectorAll('.nickInput, #chatNick').forEach(i => i.addEventListener('input', () => setNick(i.value)));
setNick(localStorage.getItem('muse_nick') || '');
function myNick(){ return (localStorage.getItem('muse_nick') || '').trim(); }
/* 分享码 */
function extract(text){
  const up=(text||'').toUpperCase();
  const m = up.match(/(?:CODE|邀请码)\s*[:：]?\s*([A-Z0-9]{6})\b/) || up.match(/\b[A-Z0-9]{6}\b/);
  return m ? (m[1]||m[0]) : null;
}
$('shareText').addEventListener('input', ()=>{
  const code = extract($('shareText').value);
  $('detectHint').textContent = code ? '识别到：'+code : '';
});
function myTokens(){ try{ return JSON.parse(localStorage.getItem('muse_tokens')||'[]'); }catch(e){ return []; } }
function saveToken(t){ const a = myTokens(); if(!a.includes(t)){ a.push(t); localStorage.setItem('muse_tokens', JSON.stringify(a)); } }
function dropToken(t){ localStorage.setItem('muse_tokens', JSON.stringify(myTokens().filter(x=>x!==t))); }
$('shareBtn').onclick = async ()=>{
  const rawText = $('shareText').value.trim();
  if(!extract(rawText)){ toast('没识别到 6 位邀请码，检查一下粘贴内容'); return; }
  const r = await fetch('/api/codes', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({rawText, totalSlots: $('shareSlots').value, imageDataUrl: $('shareFileBox').dataset.url || null})});
  const data = await r.json();
  if(!r.ok){ toast(data.error||'提交失败'); return; }
  saveToken(data.manageToken);
  const link = location.origin + data.managePath;
  const box = $('manageBox'); box.style.display='block';
  box.innerHTML = `已加入列表 ✅ 并记到「我的」页。<br>管理链接（只显示这一次，建议保存）：<br><a href="${link}">${link}</a>`;
  $('shareText').value=''; $('detectHint').textContent=''; $('sharePreview').innerHTML=''; delete $('shareFileBox').dataset.url; $('shareFile').value='';
  toast('分享成功'); load();
};
/* 晒图 */
$('galBtn').onclick = async ()=>{
  const dataUrl = $('galFileBox').dataset.url;
  if(!dataUrl){ toast('先选一张图片'); return; }
  const r = await fetch('/api/gallery', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({dataUrl, caption: $('galCaption').value, name: myNick()})});
  const data = await r.json();
  if(!r.ok){ toast(data.error||'发图失败'); return; }
  state = data; render();
  $('galPreview').innerHTML=''; delete $('galFileBox').dataset.url; $('galFile').value=''; $('galCaption').value='';
  toast('已发到晒图墙');
};
/* 聊天 */
async function sendChat(){
  const text = $('chatText').value.trim();
  if(!text){ toast('先写点什么'); return; }
  const r = await fetch('/api/comments', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name: myNick(), text})});
  const data = await r.json();
  if(!r.ok){ toast(data.error||'发送失败'); return; }
  state = data; render(); $('chatText').value='';
  window.scrollTo({top: document.body.scrollHeight});
}
$('chatSend').onclick = sendChat;
$('chatText').addEventListener('keydown', e => { if(e.key==='Enter') sendChat(); });
/* 我的 */
$('copyPin').onclick = async ()=>{ toast(await copyText('95AOAK') ? '已复制 95AOAK' : '复制失败，码是 95AOAK'); };
async function renderMine(){
  const list = $('myList'); if(!list) return;
  const toks = myTokens();
  if(!toks.length){ list.innerHTML = '<div class="empty">还没有记录。在首页分享一个码，它会自动出现在这里。</div>'; return; }
  const parts = [];
  for(const t of toks){
    try{
      const r = await fetch('/api/manage/'+t); const d = await r.json();
      if(!r.ok){ parts.push(`<div class="card grey"><span class="note">一条记录已失效（可能已被删除）</span> <button class="mini" onclick="dropToken('${t}');renderMine()">移除</button></div>`); continue; }
      const c = d.entry;
      parts.push(`<div class="card">
        <div class="row"><span class="code" style="font-size:20px">${esc(c.code)}</span>${badge(c)}
        <span class="grow"></span><span class="slots">剩余 ${c.remaining}/${c.totalSlots} · 被复制 ${c.usedCount} 次</span></div>
        <div class="row" style="margin-top:10px">
          <input type="number" min="0" value="${c.remaining}" id="rem-${t}" style="max-width:110px">
          <button onclick="saveRemain('${t}')">保存名额</button>
          <button onclick="delMine('${t}')">删除</button>
        </div></div>`);
    }catch(e){ /* 网络问题时跳过 */ }
  }
  list.innerHTML = parts.join('');
}
window.saveRemain = async t => {
  const v = $('rem-'+t).value;
  const r = await fetch('/api/manage/'+t, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({remaining: v})});
  if(r.ok){ toast('已保存'); load(); } else toast('保存失败');
};
window.delMine = async t => {
  if(!confirm('确认删除你分享的这条码？')) return;
  const r = await fetch('/api/manage/'+t, {method:'DELETE'});
  if(r.ok){ dropToken(t); toast('已删除'); load(); } else toast('删除失败');
};
window.dropToken = dropToken; window.renderMine = renderMine;
$('mgAdd').onclick = async ()=>{
  const t = $('mgToken').value.trim(); if(!t) return;
  const r = await fetch('/api/manage/'+t);
  if(!r.ok){ $('mgInfo').textContent = '凭据无效，查不到这条分享'; return; }
  saveToken(t); $('mgToken').value=''; $('mgInfo').textContent = '已添加，去上面列表看';
  renderMine();
};
fetch('/api/visit', {method:'POST'}).catch(()=>{}).finally(()=>load());
setInterval(()=>{ load(); }, 30000);
</script>
</body>
</html>
